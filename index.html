
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gen Z Maximalist</title>
<style>
body {
 margin:0; background:#000; color:white;
 font-family:'Arial'; overflow-x:hidden;
}
.hero {
 height:100vh; display:flex; flex-direction:column;
 align-items:center; justify-content:center; text-align:center;
 background:linear-gradient(135deg,#ff00e6,#00ffe1,#7700ff);
 animation:bgshift 10s infinite alternate;
}
@keyframes bgshift {
 0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(120deg);}
}
h1 {font-size:4rem; text-shadow:0 0 20px #fff;}
p {font-size:1.2rem;}
.btn {
 padding:18px 40px; background:#00ff88; color:#000;
 font-weight:bold; border-radius:40px; text-decoration:none;
 box-shadow:0 0 20px #00ff88; transition:0.3s;
}
.btn:hover {transform:scale(1.1); box-shadow:0 0 40px #00ff88;}
.section {
 padding:80px 20px; text-align:center;
}
.card {
 display:inline-block; width:280px; background:#111;
 margin:20px; padding:20px; border-radius:20px;
 box-shadow:0 0 20px #ff00e6; transition:0.3s;
}
.card:hover {transform:translateY(-10px) scale(1.05);}
.title {font-size:2rem; margin-bottom:20px;}
</style>
</head>
<body>

<div class="hero">
 <h1>GEN Z MAXIMALIST</h1>
 <p>Bold. Chaotic. Aesthetic. Hyper-Visual.</p>
 <a href="https://wa.me/6282234472835" class="btn">Chat WhatsApp</a>
</div>

<div class="section">
 <h2 class="title">Portfolio Project</h2>
 <div class="card"><h3>Konten Viral</h3><p>Short-form copy yang tajam & chaotic.</p></div>
 <div class="card"><h3>Brand Glow-Up</h3><p>Identitas visual loud & neon.</p></div>
 <div class="card"><h3>Script Reels</h3><p>Narasi hook psikologis Gen Z.</p></div>
</div>

<div class="section">
 <h2 class="title">Contact</h2>
 <p>Klik tombol WhatsApp di atas untuk pesan jasa.</p>
</div>

</body>
</html>
